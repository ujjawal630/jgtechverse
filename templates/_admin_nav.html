<nav class="admin-topbar" aria-label="Operations Portal Navigation">
    <div class="admin-topbar-left">
        <div class="admin-topbar-brand">
            <span class="admin-portal-badge">
                <span class="admin-live-dot" aria-hidden="true"></span>
                <span>OPERATIONS CONSOLE</span>
            </span>
        </div>

        <div class="admin-nav-group" role="tablist">
            {% if current_user.role == 'admin' %}
            <a class="admin-nav-item {{ 'active' if request.endpoint in ('admin_home', 'admin_team') else '' }}"
               href="{{ url_for('admin_home') }}"
               {% if request.endpoint in ('admin_home', 'admin_team') %}aria-current="page"{% endif %}
               role="tab">
                <svg class="admin-nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>By Team</span>
            </a>
            {% endif %}

            <a class="admin-nav-item {{ 'active' if request.endpoint == 'admin_arena' else '' }}"
               href="{{ url_for('admin_arena') }}"
               {% if request.endpoint == 'admin_arena' %}aria-current="page"{% endif %}
               role="tab">
                <svg class="admin-nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>By Arena</span>
            </a>

            {% if current_user.role == 'admin' %}
            <a class="admin-nav-item {{ 'active' if request.endpoint in ('admin_repositories', 'admin_repositories_export') else '' }}"
               href="{{ url_for('admin_repositories') }}"
               {% if request.endpoint in ('admin_repositories', 'admin_repositories_export') %}aria-current="page"{% endif %}
               role="tab">
                <svg class="admin-nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <span>GitHub Repositories</span>
            </a>

            <a class="admin-nav-item {{ 'active' if request.endpoint == 'admin_users' else '' }}"
               href="{{ url_for('admin_users') }}"
               {% if request.endpoint == 'admin_users' %}aria-current="page"{% endif %}
               role="tab">
                <svg class="admin-nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <line x1="19" y1="8" x2="19" y2="14"></line>
                    <line x1="22" y1="11" x2="16" y2="11"></line>
                </svg>
                <span>Users</span>
            </a>
            {% endif %}
        </div>
    </div>

    <div class="admin-topbar-right">
        <div class="user-badge who" aria-label="Current logged in user">
            <svg class="user-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M5.5 21a8.38 8.38 0 0 1 13 0"></path>
            </svg>
            <span class="user-badge-name">{{ current_user.username }}</span>
            <span class="role-badge role-{{ current_user.role|lower }}">{{ current_user.role }}</span>
        </div>

        <form method="post" action="{{ url_for('logout') }}" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="logout-btn" title="Sign out of administrative session" aria-label="Sign out">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </button>
        </form>
    </div>
</nav>
